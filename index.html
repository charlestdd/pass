<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Gate: Summoner</title>
    <style>
        :root {
            --common: #b2bec3; --rare: #0984e3; --epic: #6c5ce7; --legendary: #fdcb6e; --mythic: #d63031;
            --order: #74b9ff; --chaos: #a29bfe; --creation: #55efc4; --destruction: #ff7675;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }
        .ui-panel {
            background: rgba(30, 41, 59, 0.8); padding: 20px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            text-align: center; width: 350px; z-index: 10;
        }
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        .timer { font-size: 0.8em; color: #94a3b8; }
        
        button {
            background: linear-gradient(45deg, #3498db, #2980b9); color: white;
            border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer;
            font-size: 1.1em; transition: 0.3s; width: 100%;
        }
        button:disabled { background: #475569; cursor: not-allowed; }

        /* The Summoning Animation */
        #gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center;
            z-index: 100; transition: 0.5s;
        }
        .character-card {
            background: white; color: #1e293b; padding: 30px; border-radius: 15px;
            text-align: center; transform: scale(0.5); opacity: 0;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .active-card { transform: scale(1); opacity: 1; }
        
        .type-badge { padding: 4px 10px; border-radius: 5px; font-size: 0.8em; color: white; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <h1>Cosmic Gate</h1>
        <div class="stats">
            <span>Wishes: <span id="wishCount">10</span></span>
            <span id="pityCount" style="font-size: 0.7em; align-self: center;">Pity: 0/80</span>
        </div>
        <div class="timer">Next wish in: <span id="timerText">30s</span></div>
        <br>
        <button id="pullBtn" onclick="summon()">SUMMON</button>
    </div>

    <div id="gate">
        <div id="card" class="character-card">
            <h2 id="resultName">???</h2>
            <div id="resultType" class="type-badge">TYPE</div>
            <p id="resultRarity">Rarity</p>
            <button onclick="closeGate()" style="margin-top:20px; padding:10px;">Confirm</button>
        </div>
    </div>

<script>
    // DATA
    const data = {
        characters: [
            { name: "Senzuku Sakuri", type: "Order", rank: 5 }, { name: "Kasumi Kurogane", type: "Chaos", rank: 5 },
            { name: "Noriko Hoshino", type: "Creation", rank: 5 }, { name: "Rogu Kurai", type: "Destruction", rank: 5 },
            { name: "Caleb Lukas", type: "Order", rank: 4 }, { name: "Rin Vance", type: "Chaos", rank: 4 },
            { name: "Hinari Shirogane", type: "Destruction", rank: 4 }, { name: "Kathleen Damascus", type: "Creation", rank: 4 }
        ],
        weapons: [
            { name: "Binding Contract", type: "Order", rank: 3 }, { name: "Dimension Restriction", type: "Order", rank: 3 },
            { name: "Absolute Lock", type: "Order", rank: 3 }, { name: "Perfect Interval", type: "Order", rank: 3 },
            { name: "Multiple Existence", type: "Chaos", rank: 3 }, { name: "Dimension Expansion", type: "Chaos", rank: 3 },
            { name: "Reaction Modification", type: "Chaos", rank: 3 }, { name: "Instability Surge", type: "Chaos", rank: 3 },
            { name: "Wu Summoning", type: "Creation", rank: 3 }, { name: "Dimension Creation", type: "Creation", rank: 3 },
            { name: "Puppeteer", type: "Creation", rank: 3 }, { name: "Constellation Link", type: "Creation", rank: 3 },
            { name: "Final Merge", type: "Destruction", rank: 3 }, { name: "Dimension Overload", type: "Destruction", rank: 3 },
            { name: "Precise Collapsion", type: "Destruction", rank: 3 }, { name: "Extreme Rupture", type: "Destruction", rank: 3 }
        ]
    };

    let wishes = 10;
    let pity = 0;
    let fourStarPity = 0;
    let timeLeft = 30;

    // TIMER SYSTEM
    setInterval(() => {
        timeLeft--;
        if(timeLeft <= 0) {
            wishes++;
            timeLeft = 30;
            updateUI();
        }
        document.getElementById('timerText').innerText = timeLeft + "s";
    }, 1000);

    function updateUI() {
        document.getElementById('wishCount').innerText = wishes;
        document.getElementById('pityCount').innerText = `Pity: ${pity}/80`;
    }

    // SUMMON SYSTEM
    function summon() {
        if(wishes < 1) return;
        wishes--;
        pity++;
        fourStarPity++;
        updateUI();

        let result;
        let roll = Math.random() * 100;

        // Pity Logic
        if(pity >= 80) { result = getRand(data.characters.filter(c => c.rank === 5)); pity = 0; }
        else if(fourStarPity >= 10) { result = getRand(data.characters.filter(c => c.rank === 4)); fourStarPity = 0; }
        else if(roll < 1.6) { result = getRand(data.characters.filter(c => c.rank === 5)); pity = 0; }
        else if(roll < 12) { result = getRand(data.characters.filter(c => c.rank === 4)); fourStarPity = 0; }
        else { result = getRand(data.weapons); }

        showAnimation(result);
    }

    function getRand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function showAnimation(item) {
        const gate = document.getElementById('gate');
        const card = document.getElementById('card');
        const colors = { 3: '#0984e3', 4: '#6c5ce7', 5: '#fdcb6e' };
        
        gate.style.display = 'flex';
        gate.style.background = colors[item.rank];
        
        document.getElementById('resultName').innerText = item.name;
        document.getElementById('resultRarity').innerText = "⭐".repeat(item.rank);
        document.getElementById('resultType').innerText = item.type;
        document.getElementById('resultType').style.backgroundColor = `var(--${item.type.toLowerCase()})`;

        setTimeout(() => { card.classList.add('active-card'); }, 100);
    }

    function closeGate() {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('card').classList.remove('active-card');
    }
</script>
</body>
</html>
